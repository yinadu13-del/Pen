<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Tập Từ Vựng HSK 2 Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        .perspective-1000 {
            perspective: 1000px;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .is-flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            padding: 2rem;
        }

        .flip-card-front {
            background-color: #ffffff;
            color: #1f2937;
            border: 1px solid #f3f4f6;
        }

        .flip-card-back {
            background-color: #2563eb;
            color: white;
            transform: rotateY(180deg);
            background-image: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        }

        .btn-hover-effect {
            transition: all 0.2s ease-in-out;
        }
        
        .btn-hover-effect:active {
            transform: scale(0.95);
        }

        /* Tùy chỉnh thanh cuộn cho đẹp */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8; 
        }
    </style>
</head>

            { hanzi: "运动", pinyin: "yùndòng", meaning: "(đt., dt.) Vận động, tập thể thao" },
            { hanzi: "再", pinyin: "zài", meaning: "(phó.) Lại, thêm" },
            { hanzi: "早上", pinyin: "zǎoshang", meaning: "(dt.) Buổi sáng" },
            { hanzi: "丈夫", pinyin: "zhàngfu", meaning: "(dt.) Chồng" },
            { hanzi: "找", pinyin: "zhǎo", meaning: "(đt.) Tìm" },
            { hanzi: "着", pinyin: "zhe", meaning: "(trợ.) Đang" },
            { hanzi: "真", pinyin: "zhēn", meaning: "(phó.) Thật" },
            { hanzi: "正在", pinyin: "zhèngzài", meaning: "(phó.) Đang" },
            { hanzi: "知道", pinyin: "zhīdào", meaning: "(đt.) Biết" },
            { hanzi: "准备", pinyin: "zhǔnbèi", meaning: "(đt.) Chuẩn bị" },
            { hanzi: "走", pinyin: "zǒu", meaning: "(đt.) Đi, đi bộ" },
            { hanzi: "最", pinyin: "zuì", meaning: "(phó.) Nhất" },
            { hanzi: "左边", pinyin: "zuǒbian", meaning: "(dt.) Bên trái" }
        ];

        let groupedVocabulary = {};
        fullVocabulary.forEach(word => {
            const letter = word.pinyin.charAt(0).toUpperCase();
            if (!groupedVocabulary[letter]) groupedVocabulary[letter] = [];
            groupedVocabulary[letter].push(word);
        });

        let currentVocabulary = [];
        let currentIndex = 0;
        let currentGroup = '';
        
        // Quản lý từ chưa thuộc qua LocalStorage
        let reviewList = [];
        try {
            const stored = localStorage.getItem('hsk2_review_list');
            if (stored) reviewList = JSON.parse(stored);
        } catch(e) { console.error("Could not load review list"); }

        // Biến cho Quiz
        let quizScore = 0;
        let isQuizAnswered = false;

        // Elements
        const DOM = {
            mainMenu: document.getElementById('main-menu'),
            learningSection: document.getElementById('learning-section'),
            quizSection: document.getElementById('quiz-section'),
            toast: document.getElementById('toast'),
            reviewCount: document.getElementById('review-count'),
            starIcon: document.getElementById('star-icon')
        };

        function initMenu() {
            const grid = document.getElementById('alphabet-grid');
            grid.innerHTML = '';
            Object.keys(groupedVocabulary).sort().forEach(letter => {
                const count = groupedVocabulary[letter].length;
                const btn = document.createElement('button');
                btn.className = 'btn-hover-effect flex flex-col items-center justify-center p-5 bg-white border border-gray-200 rounded-2xl shadow-sm hover:shadow-md hover:border-blue-400 transition-all group';
                btn.onclick = () => startLearning(letter, groupedVocabulary[letter]);
                btn.innerHTML = `
                    <span class="text-3xl font-extrabold text-gray-700 group-hover:text-blue-600 mb-2 transition-colors">${letter}</span>
                    <span class="text-xs font-medium text-gray-500 bg-gray-100 px-3 py-1 rounded-full group-hover:bg-blue-50 group-hover:text-blue-600 transition-colors">${count} từ</span>
                `;
                grid.appendChild(btn);
            });
            updateReviewCountUI();
        }

        function showToast(message) {
            DOM.toast.textContent = message;
            DOM.toast.classList.remove('opacity-0', 'translate-y-4');
            setTimeout(() => DOM.toast.classList.add('opacity-0', 'translate-y-4'), 2500);
        }

        function updateReviewCountUI() {
            DOM.reviewCount.textContent = reviewList.length;
        }

        function startReviewLearning() {
            if (reviewList.length === 0) {
                showToast("Bạn chưa có từ nào trong danh sách cần ôn!");
                return;
            }
            // Lọc ra các từ có trong reviewList từ danh sách gốc
            const wordsToReview = fullVocabulary.filter(w => reviewList.includes(w.hanzi));
            startLearning("Chưa thuộc", wordsToReview);
        }

        function startLearning(groupName, wordsArray) {
            currentGroup = groupName;
            // Copy mảng để không ảnh hưởng dữ liệu gốc khi xáo trộn
            currentVocabulary = [...wordsArray]; 
            currentIndex = 0;
            
            document.getElementById('group-title').textContent = groupName === 'Chưa thuộc' ? 'Ôn Tập' : `Nhóm ${groupName}`;
            document.getElementById('total-words').textContent = currentVocabulary.length;
            
            DOM.mainMenu.classList.add('hidden');
            DOM.learningSection.classList.remove('hidden');
            updateCard();
        }

        function showMainMenu() {
            DOM.learningSection.classList.add('hidden');
            DOM.quizSection.classList.add('hidden');
            DOM.mainMenu.classList.remove('hidden');
            document.getElementById('flashcard').classList.remove('is-flipped');
            initMenu(); // Cập nhật lại số lượng từ chưa thuộc
        }

        function updateCard() {
            const word = currentVocabulary[currentIndex];
            const flashcard = document.getElementById('flashcard');
            flashcard.classList.remove('is-flipped');
            
            // Cập nhật trạng thái Ngôi sao
            if (reviewList.includes(word.hanzi)) {
                DOM.starIcon.classList.remove('text-gray-300');
                DOM.starIcon.classList.add('text-amber-400', 'fill-current');
            } else {
                DOM.starIcon.classList.remove('text-amber-400', 'fill-current');
                DOM.starIcon.classList.add('text-gray-300');
            }
            
            setTimeout(() => {
                document.getElementById('front-text').textContent = word.pinyin;
                document.getElementById('back-hanzi').textContent = word.hanzi;
                document.getElementById('back-meaning').textContent = word.meaning;
                
                document.getElementById('current-index').textContent = currentIndex + 1;
                document.getElementById('progress-bar').style.width = `${((currentIndex + 1) / currentVocabulary.length) * 100}%`;
                
                const btnPrev = document.getElementById('btn-prev');
                const btnNext = document.getElementById('btn-next');
                btnPrev.disabled = currentIndex === 0;
                
                if (currentIndex === currentVocabulary.length - 1) {
                    btnNext.innerHTML = 'Xong <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>';
                    btnNext.classList.replace('bg-blue-600', 'bg-green-600');
                    btnNext.classList.replace('hover:bg-blue-700', 'hover:bg-green-700');
                } else {
                    btnNext.innerHTML = 'Tiếp <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>';
                    btnNext.classList.replace('bg-green-600', 'bg-blue-600');
                    btnNext.classList.replace('hover:bg-green-700', 'hover:bg-blue-700');
                }
            }, 150);
        }

        function flipCard() {
            document.getElementById('flashcard').classList.toggle('is-flipped');
        }

        function prevCard() {
            if (currentIndex > 0) { currentIndex--; updateCard(); }
        }

        function nextCard() {
            if (currentIndex < currentVocabulary.length - 1) {
                currentIndex++; updateCard();
            } else {
                showMainMenu();
                showToast(`Đã hoàn thành nhóm ${currentGroup}!`);
            }
        }

        function toggleReview(event) {
            event.stopPropagation(); // Ngăn lật thẻ khi bấm sao
            const hanzi = currentVocabulary[currentIndex].hanzi;
            const indexInList = reviewList.indexOf(hanzi);
            
            if (indexInList > -1) {
                reviewList.splice(indexInList, 1);
                showToast("Đã bỏ đánh dấu");
            } else {
                reviewList.push(hanzi);
                showToast("Đã lưu vào từ chưa thuộc");
            }
            
            try { localStorage.setItem('hsk2_review_list', JSON.stringify(reviewList)); } 
            catch(e) {}
            
            updateCard(); // Cập nhật lại màu sao
        }

        function shuffleCards() {
            // Fisher-Yates shuffle
            for (let i = currentVocabulary.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentVocabulary[i], currentVocabulary[j]] = [currentVocabulary[j], currentVocabulary[i]];
            }
            currentIndex = 0;
            updateCard();
            showToast("Đã xáo trộn thứ tự từ!");
        }

        function startQuiz() {
            DOM.learningSection.classList.add('hidden');
            DOM.quizSection.classList.remove('hidden');
            document.getElementById('quiz-content').classList.remove('hidden');
            document.getElementById('quiz-result').classList.add('hidden');
            
            quizScore = 0;
            currentIndex = 0; // Reset index cho quiz
            document.getElementById('quiz-total-words').textContent = currentVocabulary.length;
            renderQuizQuestion();
        }

        function exitQuiz() {
            DOM.quizSection.classList.add('hidden');
            DOM.learningSection.classList.remove('hidden');
            currentIndex = 0; // Quay về từ đầu tiên khi thoát
            updateCard();
        }

        // Hàm phát âm tiếng Trung
        function speakText(text, event) {
            if (event) event.stopPropagation(); // Ngăn lật thẻ khi bấm loa
            
            if (!('speechSynthesis' in window)) {
                showToast("Trình duyệt của bạn không hỗ trợ tính năng phát âm.");
                return;
            }
            
            // Hủy giọng đọc hiện tại nếu đang đọc
            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN'; // Tiếng Trung giản thể
            utterance.rate = 0.85; // Tốc độ đọc chậm một chút để dễ nghe
            
            window.speechSynthesis.speak(utterance);
        }

        function renderQuizQuestion() {
            isQuizAnswered = false;
            const word = currentVocabulary[currentIndex];
            
            document.getElementById('quiz-hanzi').textContent = word.hanzi;
            document.getElementById('quiz-pinyin').textContent = word.pinyin;
            document.getElementById('quiz-current').textContent = currentIndex + 1;
            document.getElementById('quiz-score-display').textContent = quizScore;
            
            // Lấy 3 đáp án sai ngẫu nhiên từ toàn bộ từ vựng (khác từ hiện tại)
            let wrongOptions = [];
            while (wrongOptions.length < 3) {
                let randomWord = fullVocabulary[Math.floor(Math.random() * fullVocabulary.length)];
                if (randomWord.hanzi !== word.hanzi && !wrongOptions.includes(randomWord.meaning)) {
                    wrongOptions.push(randomWord.meaning);
                }
            }
            
            // Trộn đáp án đúng và sai
            let options = [
                { text: word.meaning, isCorrect: true },
                { text: wrongOptions[0], isCorrect: false },
                { text: wrongOptions[1], isCorrect: false },
                { text: wrongOptions[2], isCorrect: false }
            ];
            
            for (let i = options.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [options[i], options[j]] = [options[j], options[i]];
            }
            
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';
            
            options.forEach((opt) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-4 rounded-xl border-2 border-gray-200 bg-white hover:border-purple-400 hover:bg-purple-50 font-medium text-gray-700 transition-all text-lg';
                btn.textContent = opt.text;
                btn.onclick = () => selectQuizAnswer(btn, opt.isCorrect, word.meaning);
                optionsContainer.appendChild(btn);
            });
        }

        function selectQuizAnswer(btnElement, isCorrect, correctMeaning) {
            if (isQuizAnswered) return;
            isQuizAnswered = true;
            
            const allButtons = document.getElementById('quiz-options').children;
            
            if (isCorrect) {
                btnElement.className = 'w-full text-left p-4 rounded-xl border-2 border-green-500 bg-green-50 text-green-700 font-medium transition-all text-lg';
                quizScore++;
                document.getElementById('quiz-score-display').textContent = quizScore;
            } else {
                btnElement.className = 'w-full text-left p-4 rounded-xl border-2 border-red-500 bg-red-50 text-red-700 font-medium transition-all text-lg';
                // Hiện đáp án đúng
                Array.from(allButtons).forEach(btn => {
                    if (btn.textContent === correctMeaning) {
                        btn.className = 'w-full text-left p-4 rounded-xl border-2 border-green-500 bg-green-50 text-green-700 font-medium transition-all text-lg';
                    }
                });
            }
            
            setTimeout(() => {
                currentIndex++;
                if (currentIndex < currentVocabulary.length) {
                    renderQuizQuestion();
                } else {
                    document.getElementById('quiz-content').classList.add('hidden');
                    document.getElementById('quiz-result').classList.remove('hidden');
                    document.getElementById('final-score').textContent = quizScore;
                    document.getElementById('final-total').textContent = currentVocabulary.length;
                }
            }, 1200);
        }

        // Bàn phím điều hướng
        document.addEventListener('keydown', (e) => {
            // Bấm phím S để phát âm
            if (!DOM.learningSection.classList.contains('hidden') || !DOM.quizSection.classList.contains('hidden')) {
                if (e.key === 's' || e.key === 'S') {
                    speakText(currentVocabulary[currentIndex].hanzi);
                }
            }

            if(!DOM.learningSection.classList.contains('hidden')) {
                if (e.code === 'Space') {
                    e.preventDefault(); flipCard();
                } else if (e.code === 'ArrowRight') {
                    nextCard();
                } else if (e.code === 'ArrowLeft') {
                    prevCard();
                } else if (e.code === 'Escape') {
                    showMainMenu();
                }
            }
        });

        // Khởi chạy
        initMenu();
    </script>
