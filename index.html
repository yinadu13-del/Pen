<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học HSK Cấp Tốc Cùng Cô Nana</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        /* Hiệu ứng lật thẻ 3D */
        .perspective {
            perspective: 1000px;
        }
        .preserve-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        #flashcard-inner {
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }
        #flashcard.flipped #flashcard-inner {
            transform: rotateY(180deg);
        }

        .btn-hover-effect {
            transition: transform 0.1s, box-shadow 0.2s;
        }
        .btn-hover-effect:active {
            transform: scale(0.95);
        }

        /* Màn hình chọn cấp độ */
        .level-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .level-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />

            <button onclick="selectLevel('hsk2')" class="level-card bg-white rounded-3xl p-8 border border-gray-100 shadow-sm text-left group overflow-hidden relative">

                        Bắt đầu học

                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                        </svg>

                </div>

    </div>

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />

        <div id="quiz-options" class="w-full flex flex-col gap-3">

        }

        document.addEventListener('keydown', (event) => {
            if (event.key === 's' || event.key === 'S') {
                if (!DOM.learningSection.classList.contains('hidden') && currentVocabulary.length > 0) {
                    speak(currentVocabulary[currentIndex].hanzi);
                } else if (!DOM.quizSection.classList.contains('hidden') && currentVocabulary.length > 0) {
                    speak(currentVocabulary[currentIndex].hanzi);
                }
            }
        });

        function selectLevel(level) {
            currentLevel = level;
            currentFullVocabulary = level === 'hsk1' ? hsk1Vocabulary : hsk2Vocabulary;
            
            // Khởi tạo và phân nhóm từ vựng theo chữ cái đầu
            groupedVocabulary = {};
            
            currentFullVocabulary.forEach(word => {
                let letter = word.pinyin.trim().charAt(0).toUpperCase();
                // Sửa một số pinyin bắt đầu bằng ký tự đặc biệt
                if (!letter.match(/[A-Z]/)) {
                    letter = letter.normalize("NFD").replace(/[\u0300-\u036f]/g, "").charAt(0);
                }
                
                if (!groupedVocabulary[letter]) {
                    groupedVocabulary[letter] = [];
                }
                groupedVocabulary[letter].push(word);
            });
            
            DOM.menuTitle.textContent = level === 'hsk1' ? 'Từ Vựng HSK 1' : 'Từ Vựng HSK 2';
            
            loadReviewList();
            
            DOM.levelSelection.classList.add('hidden');
            DOM.mainMenu.classList.remove('hidden');
            initMenu();
        }

        function showLevelSelection() {
            DOM.mainMenu.classList.add('hidden');
            DOM.learningSection.classList.add('hidden');
            DOM.quizSection.classList.add('hidden');
            DOM.levelSelection.classList.remove('hidden');
        }

        function loadReviewList() {
            reviewList = [];
            const storageKey = `hsk_review_list_${currentLevel}`;
            try {
                const stored = localStorage.getItem(storageKey);
                if (stored) {
                    reviewList = JSON.parse(stored);
                }
            } catch(e) {
                console.error("Could not load review list");
            }
            updateReviewCountUI();
        }

        function saveReviewList() {
            const storageKey = `hsk_review_list_${currentLevel}`;
            try {
                localStorage.setItem(storageKey, JSON.stringify(reviewList));
            } catch(e) {}
        }

        function updateReviewCountUI() {
            const count = currentFullVocabulary.filter(w => reviewList.includes(w.hanzi)).length;
            DOM.reviewCount.textContent = count;
        }

        function initMenu() {
            const grid = document.getElementById('alphabet-grid');
            grid.innerHTML = '';
            
            const letters = Object.keys(groupedVocabulary).sort();
            
            letters.forEach(letter => {
                const count = groupedVocabulary[letter].length;
                const btn = document.createElement('button');
                btn.className = "bg-white p-6 rounded-2xl shadow-sm hover:shadow-md border border-gray-100 flex flex-col items-center justify-center transition-all hover:border-blue-300 hover:text-blue-600 group btn-hover-effect";
                btn.innerHTML = `
                    <span class="text-3xl font-black text-gray-700 group-hover:text-blue-600 transition-colors">${letter}</span>
                    <span class="text-xs font-semibold text-gray-400 mt-2 bg-gray-50 px-2 py-1 rounded-full group-hover:bg-blue-50 group-hover:text-blue-500">${count} từ</span>
                `;
                btn.onclick = () => startLearning(`Nhóm ${letter}`, groupedVocabulary[letter]);
                grid.appendChild(btn);
            });
        }

        function startReviewLearning() {
            const wordsToReview = currentFullVocabulary.filter(w => reviewList.includes(w.hanzi));
            if (wordsToReview.length === 0) {
                showToast("Bạn chưa có từ nào trong danh sách cần ôn!");
                return;
            }
            startLearning("Chưa thuộc", wordsToReview);
        }

        function startLearning(groupName, wordsArray) {
            currentVocabulary = [...wordsArray];
            currentIndex = 0;
            
            document.getElementById('group-title').textContent = groupName;
            document.getElementById('total-cards').textContent = currentVocabulary.length;
            
            DOM.mainMenu.classList.add('hidden');
            DOM.learningSection.classList.remove('hidden');
            DOM.learningSection.classList.add('flex');
            
            updateCard();
        }

        function showMenu() {
            DOM.learningSection.classList.add('hidden');
            DOM.learningSection.classList.remove('flex');
            DOM.quizSection.classList.add('hidden');
            DOM.quizSection.classList.remove('flex');
            DOM.mainMenu.classList.remove('hidden');
            updateReviewCountUI();
        }

        document.getElementById('flashcard').addEventListener('click', function() {
            this.classList.toggle('flipped');
        });

        function updateCard() {
            const word = currentVocabulary[currentIndex];
            document.getElementById('current-index').textContent = currentIndex + 1;
            
            document.getElementById('flashcard').classList.remove('flipped');
            
            // Xử lý dấu nháy đơn, nháy kép nếu có (dù HSK thường ít có, dùng escape an toàn)
            const safeHanzi = word.hanzi.replace(/'/g, "\\'");

            document.getElementById('flashcard-front').innerHTML = `
                <button onclick="event.stopPropagation(); speak('${safeHanzi}')" class="absolute top-4 left-4 text-gray-400 hover:text-blue-500 transition-colors p-2 z-10" title="Phát âm (Phím S)">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5 10v4a2 2 0 002 2h2.586l3.707 3.707a1 1 0 001.707-.707V4.929a1 1 0 00-1.707-.707L9.586 8H7a2 2 0 00-2 2z" />
                    </svg>
                </button>
                <div class="text-5xl font-bold text-blue-600 mb-4">${word.pinyin}</div>
                <div class="text-gray-500 text-sm">Chạm để xem nghĩa</div>
            `;
            
            document.getElementById('flashcard-back').innerHTML = `
                <button onclick="event.stopPropagation(); speak('${safeHanzi}')" class="absolute top-4 left-4 text-blue-300 hover:text-white transition-colors p-2 z-10" title="Phát âm (Phím S)">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5 10v4a2 2 0 002 2h2.586l3.707 3.707a1 1 0 001.707-.707V4.929a1 1 0 00-1.707-.707L9.586 8H7a2 2 0 00-2 2z" />
                    </svg>
                </button>
                <div class="text-6xl font-black mb-6 tracking-wide drop-shadow-md">${word.hanzi}</div>
                <div class="text-xl font-medium bg-white/20 px-6 py-2 rounded-2xl backdrop-blur-sm">${word.meaning}</div>
            `;

            if (reviewList.includes(word.hanzi)) {
                DOM.starIcon.classList.add('fill-amber-400', 'text-amber-400');
                DOM.starIcon.classList.remove('text-gray-400');
            } else {
                DOM.starIcon.classList.remove('fill-amber-400', 'text-amber-400');
                DOM.starIcon.classList.add('text-gray-400');
            }
        }

        function nextCard() {
            if (currentIndex < currentVocabulary.length - 1) {
                currentIndex++;
                updateCard();
            } else {
                showToast("Đã đến từ cuối cùng của nhóm!");
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        function toggleReview() {
            const word = currentVocabulary[currentIndex];
            const hanzi = word.hanzi;
            const indexInList = reviewList.indexOf(hanzi);
            
            if (indexInList > -1) {
                reviewList.splice(indexInList, 1);
                showToast("Đã bỏ đánh dấu");
            } else {
                reviewList.push(hanzi);
                showToast("Đã lưu vào từ chưa thuộc");
            }
            
            saveReviewList();
            updateCard();
        }

        function shuffleCurrent() {
            for (let i = currentVocabulary.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentVocabulary[i], currentVocabulary[j]] = [currentVocabulary[j], currentVocabulary[i]];
            }
            currentIndex = 0;
            updateCard();
            showToast("Đã xáo trộn danh sách từ!");
        }

        function startQuiz() {
            if (currentVocabulary.length === 0) return;
            
            quizScore = 0;
            currentIndex = 0;
            
            document.getElementById('quiz-total').textContent = currentVocabulary.length;
            
            DOM.learningSection.classList.add('hidden');
            DOM.learningSection.classList.remove('flex');
            DOM.quizSection.classList.remove('hidden');
            DOM.quizSection.classList.add('flex');
            
            showQuizQuestion();
        }

        function endQuiz() {
            DOM.quizSection.classList.add('hidden');
            DOM.quizSection.classList.remove('flex');
            DOM.learningSection.classList.remove('hidden');
            DOM.learningSection.classList.add('flex');
            currentIndex = 0;
            updateCard();
        }

        function showQuizQuestion() {
            isQuizAnswered = false;
            const word = currentVocabulary[currentIndex];
            const safeHanzi = word.hanzi.replace(/'/g, "\\'");
            
            document.getElementById('quiz-current').textContent = currentIndex + 1;
            document.getElementById('quiz-score-display').textContent = quizScore;
            
            let wrongOptions = [];
            while (wrongOptions.length < 3) {
                let randomWord = currentFullVocabulary[Math.floor(Math.random() * currentFullVocabulary.length)];
                if (randomWord.hanzi !== word.hanzi && !wrongOptions.includes(randomWord.meaning)) {
                    wrongOptions.push(randomWord.meaning);
                }
            }
            
            const options = [...wrongOptions, word.meaning];
            for (let i = options.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [options[i], options[j]] = [options[j], options[i]];
            }
            
            document.getElementById('quiz-question').innerHTML = `
                <div class="flex justify-center items-center gap-4 mb-4">
                    <span class="text-5xl font-bold text-gray-800">${word.hanzi}</span>
                    <button onclick="speak('${safeHanzi}')" class="text-gray-400 hover:text-blue-500 transition-colors p-2 bg-gray-100 rounded-full shadow-inner" title="Phát âm (Phím S)">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5 10v4a2 2 0 002 2h2.586l3.707 3.707a1 1 0 001.707-.707V4.929a1 1 0 00-1.707-.707L9.586 8H7a2 2 0 00-2 2z" />
                        </svg>
                    </button>
                </div>
                <div class="text-xl text-blue-600 mb-6 font-semibold">${word.pinyin}</div>
            `;
            
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';
            
            options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left bg-white border-2 border-gray-100 p-4 rounded-2xl text-gray-700 font-medium hover:border-blue-300 hover:bg-blue-50 transition-all focus:outline-none quiz-option-btn";
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(opt, word.meaning, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct, btn) {
            if (isQuizAnswered) return;
            isQuizAnswered = true;
            
            const allBtns = document.querySelectorAll('.quiz-option-btn');
            
            if (selected === correct) {
                btn.classList.remove('border-gray-100', 'hover:border-blue-300', 'hover:bg-blue-50');
                btn.classList.add('border-green-500', 'bg-green-50', 'text-green-700');
                quizScore += 10;
                document.getElementById('quiz-score-display').textContent = quizScore;
            } else {
                btn.classList.remove('border-gray-100', 'hover:border-blue-300', 'hover:bg-blue-50');
                btn.classList.add('border-red-500', 'bg-red-50', 'text-red-700');
                
                allBtns.forEach(b => {
                    if (b.textContent === correct) {
                        b.classList.remove('border-gray-100', 'hover:border-blue-300', 'hover:bg-blue-50');
                        b.classList.add('border-green-500', 'bg-green-50', 'text-green-700');
                    }
                });
            }
            
            setTimeout(() => {
                if (currentIndex < currentVocabulary.length - 1) {
                    currentIndex++;
                    showQuizQuestion();
                } else {
                    showToast(`Hoàn thành! Điểm của bạn: ${quizScore}`);
                    setTimeout(() => endQuiz(), 1500);
                }
            }, 1200);
        }

    </script>
</body>
</html>
